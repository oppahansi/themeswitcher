name: Feature request
description: Suggest an idea for the plugin
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to see?
      description: Describe the feature and what you'd use it for.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Workarounds or other approaches you've considered.

name: Build

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "manifest.json"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", "manifest.json"]

jobs:
  targets:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.read.outputs.versions }}
    steps:
      - uses: actions/checkout@v7
      - id: read
        run: echo "versions=$(jq -c . targets.json)" >> "$GITHUB_OUTPUT"

  build:
    needs: targets
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        jellyfin: ${{ fromJSON(needs.targets.outputs.versions) }}
    name: Jellyfin ${{ matrix.jellyfin }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: scripts/package.sh "${{ matrix.jellyfin }}"

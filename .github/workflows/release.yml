name: Release

# Builds the plugin for every Jellyfin version in targets.json, publishes one GitHub release
# per Jellyfin line (tag v<version>-jellyfin-<major.minor>) and updates manifest.json.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Plugin version, e.g. 1.1.0 (add a matching section to CHANGELOG.md first)"
        required: true

permissions:
  contents: write

concurrency: release

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - name: Validate version
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::version must look like 1.2.3"; exit 1; }
          grep -q "^## \[$VERSION\]" CHANGELOG.md || { echo "::error::CHANGELOG.md has no section for $VERSION"; exit 1; }
          if git ls-remote --tags origin | grep -q "refs/tags/v$VERSION-jellyfin-"; then
            echo "::error::v$VERSION is already released"; exit 1
          fi

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Package
        run: for v in $(jq -r '.[]' targets.json); do scripts/package.sh "$v" "$VERSION"; done

      - name: Publish releases
        run: |
          awk -v v="$VERSION" '$0 ~ "^## \\[" v "\\]" {on=1; next} /^## \[|^\[[^]]+\]: / {on=0} on' CHANGELOG.md > changes.md
          latest=$(jq -r '.[-1]' targets.json | cut -d. -f1,2)
          for zip in dist/*.zip; do
            line=$(basename "$zip" .zip | sed 's/.*_jellyfin-//')
            tag="v$VERSION-jellyfin-$line"
            {
              echo "Build of ThemeSwitcher $VERSION for **Jellyfin $line.x**."
              echo
              echo "Install from the plugin repository (see README) or extract the zip into \`<config>/plugins/ThemeSwitcher_$VERSION/\`, restart Jellyfin and reload the web client."
              echo
              echo "### Changes"
              cat changes.md
            } > notes.md
            latest_flag=--latest=false
            [ "$line" = "$latest" ] && latest_flag=--latest
            gh release create "$tag" "$zip" --target "$GITHUB_SHA" \
              --title "v$VERSION for Jellyfin $line" --notes-file notes.md "$latest_flag"
          done

      - name: Update manifest
        run: |
          scripts/update-manifest.py "$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git commit -m "Update manifest for v$VERSION"
          git push origin HEAD:main
